[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "A pluggable LangChain tool-calling agent for local-knowledge-base RAG Q&A, built for learning agent development and AI testing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-classic>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-community>=0.3,<0.5",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "faiss-cpu>=1.8.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
web = ["ddgs>=5.0"]

[project.scripts]
agent = "agent.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 默认只跑离线单元测试；在线集成测试需显式用 `pytest -m integration` 触发，避免误触真实 API。
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require a live LLM API key and/or local embeddings (Ollama)",
]
